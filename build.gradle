plugins { id 'java'; id 'net.minecraftforge.gradle' version '[6.0,6.2)' }
version = '4.5.1-r4'
group = 'net.codersdownunder.lootbagmod'
base { archivesName = 'lootbag-renewed-fixed' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft { mappings channel: 'official', version: '1.20.1' }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.0' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
processResources {
    def props = [mod_id: 'lootbagmod', mod_name: 'Loot Bag - Renewed (Fixed Version)', mod_version: '4.5.1',
                 minecraft_version: '1.20.1', forge_version: '47.4.0']
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('META-INF/mods.toml') { expand props }
}
jar.finalizedBy('reobfJar')
